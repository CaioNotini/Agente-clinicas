name: Tests & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev_local_123
          POSTGRES_DB: agente_estudo
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      # Checkout código
      - uses: actions/checkout@v4

      # Setup Python
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"

      # Instalar dependências
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Rodar migrations
      - name: Run Alembic migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          alembic upgrade head

      # Testes com coverage
      - name: Run pytest with coverage
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term

      # Upload coverage para Codecov (opcional)
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

      # Lint com pylint
      - name: Lint with pylint
        run: |
          pylint app/ --disable=all --enable=E,F || true
        continue-on-error: true

      # Format check com black
      - name: Check formatting with black
        run: |
          black --check app/ || true
        continue-on-error: true

      # Import sorting com isort
      - name: Check import sorting with isort
        run: |
          isort --check-only app/ || true
        continue-on-error: true
