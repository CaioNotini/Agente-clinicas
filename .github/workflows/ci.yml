name: Tests & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      APP_DB_USER: ${{ secrets.APP_DB_USER }}
      APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: localhost
      DB_PORT: "5434"
      DB_NAME: agente_estudo

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: agente_estudo
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5434:5432

    steps:
      # Checkout código
      - uses: actions/checkout@v4

      # Setup Python
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"

      # Instalar dependências
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Rodar migrations (usa DB_* do env do job)
      - name: Run Alembic migrations
        run: |
          alembic upgrade head

      # Define a senha da role da aplicação a partir dos secrets (nunca no repositório)
      - name: Definir senha de app_clinicas
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
          APP_USER: ${{ secrets.APP_DB_USER }}
          APP_PW: ${{ secrets.APP_DB_PASSWORD }}
        run: |
          printf "ALTER ROLE :\"app_user\" PASSWORD :'app_pw';\n" > /tmp/senha.sql
          psql -v app_user="$APP_USER" -v app_pw="$APP_PW" -h localhost -p 5434 -U "${{ secrets.DB_USER }}" -d agente_estudo -f /tmp/senha.sql
          rm /tmp/senha.sql

      # Define a senha da role do worker a partir dos secrets (nunca no repositório)
      - name: Definir senha de worker_jobs
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
          WORKER_USER: ${{ secrets.WORKER_DB_USER }}
          WORKER_PW: ${{ secrets.WORKER_DB_PASSWORD }}
        run: |
          printf "ALTER ROLE :\"worker_user\" PASSWORD :'worker_pw';\n" > /tmp/senha_worker.sql
          psql -v worker_user="$WORKER_USER" -v worker_pw="$WORKER_PW" -h localhost -p 5434 -U "${{ secrets.DB_USER }}" -d agente_estudo -f /tmp/senha_worker.sql
          rm /tmp/senha_worker.sql

      # Testes com coverage (usa DB_* e APP_DB_* do env do job)
      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term

      # Upload coverage para Codecov (opcional)
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

      # Lint com pylint
      - name: Lint with pylint
        run: |
          pylint app/ --disable=all --enable=E,F || true
        continue-on-error: true

      # Format check com black
      - name: Check formatting with black
        run: |
          black --check app/ || true
        continue-on-error: true

      # Import sorting com isort
      - name: Check import sorting with isort
        run: |
          isort --check-only app/ || true
        continue-on-error: true
