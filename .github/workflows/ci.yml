name: Tests & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      APP_DB_USER: ${{ secrets.APP_DB_USER }}
      APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
      WORKER_DB_USER: ${{ secrets.WORKER_DB_USER }}
      WORKER_DB_PASSWORD: ${{ secrets.WORKER_DB_PASSWORD }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: localhost
      DB_PORT: "5434"
      DB_NAME: agente_estudo

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: agente_estudo
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5434:5432

    steps:
      # Checkout código
      - uses: actions/checkout@v4

      # Setup Python
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"

      # Instalar dependências
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Ciclo de migrations: cada uma sobe, desce e sobe de novo (usa DB_* do env do job)
      - name: Run Alembic migrations (upgrade, downgrade base, upgrade)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      # Models e schema iguais depois do ciclo
      - name: Alembic check
        run: |
          alembic check

      # Falha se alguma tabela ficar sem chave primaria
      - name: Verificar chaves primarias
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          psql -X -q -v ON_ERROR_STOP=1 -h localhost -p 5434 -U "${{ secrets.DB_USER }}" -d agente_estudo -f scripts/verificar_pks.sql

      # Senhas de app_clinicas e worker_jobs a partir dos secrets (ADR 0006)
      - name: Definir senhas das roles automatizadas
        run: |
          python -m scripts.definir_senhas

      # Testes com coverage (usa DB_* e APP_DB_* do env do job)
      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term

      # Upload coverage para Codecov (opcional)
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

      # Lint com pylint: erros (E) e fatais (F) reprovam a CI
      - name: Lint with pylint
        run: |
          pylint app/ --disable=all --enable=E,F

      # Format check com black
      - name: Check formatting with black
        run: |
          black --check app/ || true
        continue-on-error: true

      # Import sorting com isort
      - name: Check import sorting with isort
        run: |
          isort --check-only app/ || true
        continue-on-error: true
