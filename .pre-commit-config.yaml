# Formatacao local antes do commit, com as mesmas versoes e o mesmo escopo da CI
# (.github/workflows/ci.yml): black e isort --profile black sobre app/.
# Instale com: pip install -r requirements-dev.txt && pre-commit install
repos:
  - repo: https://github.com/psf/black
    rev: 23.12.0
    hooks:
      - id: black
        files: ^app/

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]
        files: ^app/
