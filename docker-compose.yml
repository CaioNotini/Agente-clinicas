services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: agente_clinicas_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-agente_estudo}
      PGPASSWORD: ${DB_PASSWORD}
    ports:
      # So no loopback: o banco de desenvolvimento nao fica exposto na rede. Os dois
      # enderecos sao necessarios porque localhost resolve primeiro para ::1, e sem
      # ele cada conexao espera cerca de 2 s antes de cair para 127.0.0.1.
      - "127.0.0.1:${DB_PORT:-5434}:5432"
      - "[::1]:${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-dev} -d ${DB_NAME:-agente_estudo}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agente_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local

networks:
  agente_network:
    driver: bridge
