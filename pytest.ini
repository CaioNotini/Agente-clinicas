[pytest]
 
testpaths = tests

python_files = test_*.py

python_classes = Test*

python_functions = test_*

addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -m "not llm_real"

timeout = 10

markers =
    llm_real: chamada real a API da Anthropic, so o desenvolvedor roda, fora da CI (pytest -m llm_real)
